<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0d0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Breathe" />
    <title>Breathe</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="atmosphere" id="atmosphere" aria-hidden="true"></div>

    <main id="home" class="screen home">
      <header class="brand">
        <h1>breathe</h1>
        <p id="tagline">five minutes</p>
        <p class="whisper" id="whisper" hidden></p>
      </header>

      <div class="needs" id="needs" role="listbox" aria-label="What do you need">
        <button type="button" class="need" role="option" data-need="spike" aria-selected="false">Spike</button>
        <button type="button" class="need" role="option" data-need="fog" aria-selected="false">Fog</button>
        <button type="button" class="need" role="option" data-need="low-energy" aria-selected="false">Low energy</button>
        <button type="button" class="need" role="option" data-need="sleep" aria-selected="false">Sleep</button>
        <button type="button" class="need" role="option" data-need="urge" aria-selected="false">Urge</button>
      </div>

      <div
        class="patterns"
        id="patterns"
        role="listbox"
        aria-label="Breathing patterns"
      ></div>

      <p class="technique" id="technique"></p>

      <div class="durations" id="durations" role="radiogroup" aria-label="Session length">
        <button type="button" class="duration" role="radio" data-minutes="1" aria-checked="false">1 min</button>
        <button type="button" class="duration" role="radio" data-minutes="2" aria-checked="false">2 min</button>
        <button type="button" class="duration is-selected" role="radio" data-minutes="5" aria-checked="true">5 min</button>
        <button type="button" class="duration" role="radio" data-minutes="10" aria-checked="false">10 min</button>
      </div>
      <p class="duration-note" id="duration-note" hidden></p>

      <div class="home-actions">
        <div class="home-actions-row">
          <button type="button" class="quick-reset" id="quick-reset" aria-label="Quick Reset, about 30 seconds">Quick Reset</button>
          <button type="button" class="quick-reset" id="ride-urge" aria-label="Ride the Urge, about 3 minutes">Ride the Urge</button>
        </div>
        <p class="urge-note" id="urge-note">If you drink heavily every day, talk to a doctor before stopping suddenly.</p>
      </div>
      <button type="button" class="start" id="start">Start</button>

      <div class="prefs">
        <label class="pref">
          <input type="checkbox" id="pref-timer" />
          Always show timer
        </label>
        <label class="pref">
          <input type="checkbox" id="pref-audio" />
          Soft audio
        </label>
        <label class="pref">
          <input type="checkbox" id="pref-haptics" />
          <span id="pref-haptics-label">Haptics</span>
        </label>
        <label class="pref">
          <input type="checkbox" id="pref-body-setup" checked />
          Body setup before sessions
        </label>
        <label class="pref" id="pref-hum-wrap">
          <input type="checkbox" id="pref-hum" />
          Hum on the exhale
        </label>
      </div>
    </main>

    <div id="preroll" class="screen preroll is-hidden" hidden>
      <p class="preroll-cue" id="preroll-cue"></p>
      <p class="preroll-hint">Tap to skip</p>
    </div>

    <div id="urge-guide" class="screen urge-guide is-hidden" tabindex="-1" hidden>
      <p class="urge-line" id="urge-line" aria-live="polite"></p>
    </div>

    <div id="urge-respond" class="screen urge-respond is-hidden" hidden>
      <p class="urge-respond-line" id="urge-respond-line" tabindex="-1">What's your next move?</p>
      <div class="urge-respond-actions">
        <button type="button" class="quick-reset" id="urge-again">Another round</button>
        <button type="button" class="start" id="urge-done">Done</button>
      </div>
    </div>

    <div id="session" class="screen session is-hidden" hidden>
      <div class="session-bar">
        <button type="button" class="session-btn" id="pause-btn">Pause</button>
        <button type="button" class="session-btn" id="ease-btn" aria-label="Easier">Ease</button>
        <button type="button" class="session-btn" id="end-btn">End</button>
      </div>
      <div class="stage">
        <svg class="urge-wave" id="urge-wave" aria-hidden="true" viewBox="0 0 200 80" preserveAspectRatio="none">
          <path fill="currentColor" d="M0 58 C 20 58 20 34 40 34 C 60 34 60 58 80 58 C 100 58 100 34 120 34 C 140 34 140 58 160 58 C 180 58 180 40 200 40 V 80 H 0 Z"></path>
        </svg>
        <div class="halo" id="halo" aria-hidden="true"></div>
        <div class="bubble" id="bubble" aria-hidden="true"></div>
      </div>
      <div class="countdown" id="countdown">5:00</div>
      <p class="next-move" id="next-move" hidden>What's the smallest next move?</p>
    </div>

    <script src="protocols.js"></script>
    <script src="engine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
